<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6c55e8">
    <meta name="description" content="A colorful, simple student planner for your iPhone.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
    <title>Study Bloom</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Study Bloom home">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>study<span class="brand-light">bloom</span></span>
        </a>
        <button class="icon-button add-top" id="add-top" aria-label="Add task">+</button>
      </header>
      <main id="app" class="main-content" tabindex="-1"></main>
      <nav class="tabbar" aria-label="Main navigation">
        <button class="tab active" data-tab="today"><span aria-hidden="true">✳</span><small>Today</small></button>
        <button class="tab" data-tab="tasks"><span aria-hidden="true">☷</span><small>Tasks</small></button>
        <button class="tab" data-tab="schedule"><span aria-hidden="true">▦</span><small>Schedule</small></button>
        <button class="tab" data-tab="progress"><span aria-hidden="true">◔</span><small>Progress</small></button>
      </nav>
    </div>
    <dialog id="task-dialog" class="task-dialog">
      <form id="task-form" class="task-form">
        <div class="dialog-grabber"></div>
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">MAKE IT HAPPEN</p>
            <h2 id="dialog-title">New task</h2>
          </div>
          <button type="button" class="icon-button quiet" id="close-dialog" aria-label="Close">×</button>
        </div>
        <input type="hidden" name="id">
        <label>Task name<input name="name" required maxlength="100" placeholder="e.g. Review chapter 4"></label>
        <label>Subject<input name="subject" required maxlength="60" placeholder="e.g. Biology"></label>
        <label>Due date<input name="dueDate" type="date" required></label>
        <div class="form-grid">
          <label>Estimated minutes<input name="estimatedMinutes" type="number" min="1" max="1440" step="15" value="60" required></label>
          <label>Daily target<input name="dailyTargetMinutes" type="number" min="1" max="600" step="15" value="30" required></label>
        </div>
        <label>Priority <span class="priority-label" id="priority-label">5 / 10</span>
          <input name="priority" type="range" min="1" max="10" value="5">
        </label>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="button primary full-width" type="submit">Save task</button>
      </form>
    </dialog>
    <input id="import-file" class="visually-hidden" type="file" accept=".json,application/json">
    <script src="./app.js" defer></script>
  </body>
</html>
